<text x="700" y="30">SELECT user_id, score FROM features</text>
<text x="753" y="54">df = load('events.parquet')</text>
<text x="806" y="78">vectors = embed(documents)</text>
<text x="859" y="102">model.predict(batch)</text>
<text x="912" y="126">POST /api/v1/predict  200</text>
<text x="705" y="150">pipeline.run(extract, transform)</text>
<text x="758" y="174">context = retrieve(query, k=5)</text>
<text x="811" y="198">INSERT INTO insights VALUES ($1)</text>
<text x="864" y="222">GET /api/v1/insights  200</text>
<text x="917" y="246">loss: 0.0421  acc: 0.973</text>
<text x="710" y="270">schema.validate(payload)</text>
