<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">Thomas Teboul</title>
<desc id="d">Building toward systems where data meets AI. Software Engineering Bachelor at ESGI, École Supérieure de Génie Informatique.</desc>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade 1.2s ease-out both}
.blink{animation:blink 1.05s steps(1) infinite}
.drift{animation:drift 60s linear infinite}
.node{animation:glow 3.2s ease-in-out infinite}
.ring{animation:ring 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.dot{animation:dot 2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-264px)}}
@keyframes glow{0%,100%{fill-opacity:.12}50%{fill-opacity:.85}}
@keyframes ring{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes p0{0%{stroke-dashoffset:34}62%{stroke-dashoffset:-378.9}100%{stroke-dashoffset:-378.9}}.p0{stroke-dasharray:34 422.9;stroke-dashoffset:34;animation:p0 3.6s cubic-bezier(.45,.05,.55,.95) 1.2s infinite}@keyframes p1{0%{stroke-dashoffset:34}62%{stroke-dashoffset:-377.8}100%{stroke-dashoffset:-377.8}}.p1{stroke-dasharray:34 421.8;stroke-dashoffset:34;animation:p1 3.6s cubic-bezier(.45,.05,.55,.95) 1.8s infinite}@keyframes p2{0%{stroke-dashoffset:34}62%{stroke-dashoffset:-406.1}100%{stroke-dashoffset:-406.1}}.p2{stroke-dasharray:34 450.1;stroke-dashoffset:34;animation:p2 3.6s cubic-bezier(.45,.05,.55,.95) 2.4s infinite}@keyframes p3{0%{stroke-dashoffset:34}62%{stroke-dashoffset:-384.6}100%{stroke-dashoffset:-384.6}}.p3{stroke-dasharray:34 428.6;stroke-dashoffset:34;animation:p3 3.6s cubic-bezier(.45,.05,.55,.95) 3.0s infinite}@keyframes p4{0%{stroke-dashoffset:34}62%{stroke-dashoffset:-371.6}100%{stroke-dashoffset:-371.6}}.p4{stroke-dasharray:34 415.6;stroke-dashoffset:34;animation:p4 3.6s cubic-bezier(.45,.05,.55,.95) 3.6s infinite}@keyframes p5{0%{stroke-dashoffset:34}62%{stroke-dashoffset:-385.1}100%{stroke-dashoffset:-385.1}}.p5{stroke-dasharray:34 429.1;stroke-dashoffset:34;animation:p5 3.6s cubic-bezier(.45,.05,.55,.95) 4.2s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
