<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="40" viewBox="0 0 1280 40" role="img" aria-label="Séparateur" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Séparateur</title>
<defs>
<linearGradient id="lineL" x1="72" y1="0" x2="586" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#4FD1C5" stop-opacity="0"></stop><stop offset="1" stop-color="#4FD1C5" stop-opacity=".8"></stop>
</linearGradient>
<linearGradient id="lineR" x1="694" y1="0" x2="1208" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#8AB4FF" stop-opacity=".8"></stop><stop offset="1" stop-color="#8AB4FF" stop-opacity="0"></stop>
</linearGradient>
<linearGradient id="flow" x1="598" y1="0" x2="682" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#4FD1C5"></stop><stop offset="1" stop-color="#8AB4FF"></stop>
</linearGradient>
<radialGradient id="pulse" cx="0" cy="0" r="1">
<stop offset="0" stop-color="#8AB4FF" stop-opacity=".9"></stop><stop offset="1" stop-color="#8AB4FF" stop-opacity="0"></stop>
</radialGradient>
</defs>
<style>
.travel{animation:travel 3.2s cubic-bezier(.45,0,.55,1) infinite}
.node{animation:blink 3.2s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(84px);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.travel,.node{animation:none}.travel{opacity:0}}
</style>

<!-- rails -->
<line x1="72" y1="20" x2="586" y2="20" stroke="url(#lineL)" stroke-width="1.5" stroke-linecap="round"></line>
<line x1="694" y1="20" x2="1208" y2="20" stroke="url(#lineR)" stroke-width="1.5" stroke-linecap="round"></line>

<!-- mini pipeline: data -> model -> app -->
<path d="M605 20 L640 20 L675 20" fill="none" stroke="url(#flow)" stroke-width="2" stroke-linecap="round"></path>
<circle class="travel" cx="598" cy="20" r="2.4" fill="#EAF2FF"></circle>

<rect x="591" y="13" width="14" height="14" rx="3" fill="#0C2533" stroke="#4FD1C5" stroke-width="1.5"></rect>
<rect x="595" y="17" width="6" height="6" rx="1" fill="#4FD1C5" class="node"></rect>

<circle cx="640" cy="20" r="5.5" fill="#8AB4FF" class="node" style="animation-delay:1.1s"></circle>

<rect x="675" y="11" width="18" height="18" rx="5" fill="#132A4D" stroke="#8AB4FF" stroke-width="1.5"></rect>
<path d="M680 17h8M680 20h5M680 23h7" stroke="#EAF2FF" stroke-width="1.4" stroke-linecap="round" opacity=".85"></path>
</svg>
