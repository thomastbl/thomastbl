<text x="524" y="123" class="mono" font-size="12" fill="#63C7D8" text-anchor="end" letter-spacing="1">04</text>
<text x="358" y="156" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">PLAN</text>
<text x="358" y="182" class="mono" font-size="12.5" fill="#A9BCD6">explore the code</text>
<text x="358" y="201" class="mono" font-size="12.5" fill="#6A84A6">written plan, approved</text>
</g>
<g class="rise" style="animation-delay:0.42s">
<rect x="562" y="96" width="202" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
