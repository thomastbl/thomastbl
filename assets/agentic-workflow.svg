<text x="1190" y="123" class="mono" font-size="12" fill="#76BEEC" text-anchor="end" letter-spacing="1">07</text>
<text x="1024" y="156" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">SELF-VERIFY</text>
<text x="1024" y="182" class="mono" font-size="12.5" fill="#A9BCD6">run · observe · fix</text>
<text x="1024" y="201" class="mono" font-size="12.5" fill="#6A84A6">through MCP tools</text>
</g>
