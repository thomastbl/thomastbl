<text x="284" y="321" class="mono" font-size="12" fill="#5CCBD2" text-anchor="end" letter-spacing="1">03</text>
<text x="90" y="348" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">ORCHESTRATE</text>
<text x="90" y="370" class="mono" font-size="12.5" fill="#A9BCD6">lead session · tasks</text>
</g>
<g class="rise" style="animation-delay:0.34s">
<rect x="340" y="96" width="202" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
