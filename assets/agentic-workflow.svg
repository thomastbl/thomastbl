<text x="802" y="314" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">SHIP</text>
<text x="802" y="340" class="mono" font-size="12.5" fill="#A9BCD6">all checks green</text>
<text x="802" y="359" class="mono" font-size="12.5" fill="#6A84A6">merge + release</text>
