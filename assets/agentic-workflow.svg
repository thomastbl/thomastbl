<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="412" viewBox="0 0 1280 412" role="img" aria-labelledby="t d">
<title id="t">Agentic workflow</title>
<desc id="d">Once per project: vision, decide, orchestrate. Then a loop for every task: plan, test first, build, self-verify, review, ship, learn, and back to plan.</desc>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.node{animation:glow 3.2s ease-in-out infinite}
.loop{stroke-dasharray:6 8;animation:loop 1.4s linear infinite}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes loop{to{stroke-dashoffset:-28}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08121F"/><stop offset=".55" stop-color="#0B1A2E"/><stop offset="1" stop-color="#0E2340"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#18314F" stroke-width="1" opacity=".45"/></pattern>
<linearGradient id="flow" x1="340" y1="0" x2="1208" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4FD1C5"/><stop offset="1" stop-color="#8AB4FF"/></linearGradient>
<linearGradient id="edgeLine" x1="72" y1="0" x2="1208" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4FD1C5" stop-opacity="0"/><stop offset=".3" stop-color="#4FD1C5" stop-opacity=".7"/><stop offset=".7" stop-color="#8AB4FF" stop-opacity=".7"/><stop offset="1" stop-color="#8AB4FF" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect width="1280" height="412" rx="14"/></clipPath>
<marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4F6F97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowL" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#7FA6D6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="412" fill="url(#bg)"/>
<rect width="1280" height="412" fill="url(#grid)" opacity=".6"/>
<g class="mono" font-size="14">
<text x="72" y="44" fill="#4B6A92">thomas@work:~$</text>
<text x="205" y="44" fill="#CFE3FF">cat workflow.md</text>
<rect x="343" y="31" width="8" height="16" fill="#4FD1C5" class="blink"/>
<text x="1208" y="44" fill="#4F6F97" text-anchor="end" letter-spacing=".5">spec → plan → test → build → verify → ship → learn</text>
</g>
<path d="M441 136H1107V294H441Z" fill="none" stroke="url(#flow)" stroke-width="2" opacity=".35"/>
<circle r="3.4" fill="#EAF2FF"><animateMotion dur="9s" repeatCount="indefinite" path="M441 136H1107V294H441Z"/></circle>
<path d="M187 161V168" stroke="#4F6F97" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M187 260V267" stroke="#4F6F97" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M303 314H321V136H337" fill="none" stroke="#4F6F97" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M544 136H559" stroke="#4F6F97" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M766 136H781" stroke="#4F6F97" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M988 136H1003" stroke="#4F6F97" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1107 202V227" stroke="#4F6F97" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1004 294H989" stroke="#4F6F97" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M782 294H767" stroke="#4F6F97" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340" y="230" width="202" height="128" fill="#0B1A2E" opacity=".0"/>
<path class="loop" d="M560 294H453Q441 294 441 282V204" fill="none" stroke="#7FA6D6" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrowL)"/>
<text x="441" y="328" class="mono" font-size="12.5" fill="#7FA6D6" text-anchor="middle" letter-spacing=".5">↻ next task</text>
<text x="441" y="346" class="mono" font-size="11.5" fill="#4F6F97" text-anchor="middle">lessons compound</text>
<g class="rise" style="animation-delay:0.10s">
<rect x="72" y="72" width="230" height="88" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M84 73H290" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<rect x="90" y="88" width="12" height="12" rx="3" fill="#0C2533" stroke="#4FD1C5" stroke-width="1.4"/><rect x="93.5" y="91.5" width="5" height="5" rx="1" fill="#4FD1C5" class="node" style="animation-delay:0.00s"/>
<text x="284" y="99" class="mono" font-size="12" fill="#4FD1C5" text-anchor="end" letter-spacing="1">01</text>
<text x="90" y="126" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">VISION</text>
<text x="90" y="148" class="mono" font-size="12.5" fill="#A9BCD6">vision.md · roadmap.md</text>
</g>
<g class="rise" style="animation-delay:0.18s">
<rect x="72" y="171" width="230" height="88" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M84 172H290" stroke="#56CECB" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<rect x="90" y="187" width="12" height="12" rx="3" fill="#0C2533" stroke="#56CECB" stroke-width="1.4"/><rect x="93.5" y="190.5" width="5" height="5" rx="1" fill="#56CECB" class="node" style="animation-delay:0.35s"/>
<text x="284" y="198" class="mono" font-size="12" fill="#56CECB" text-anchor="end" letter-spacing="1">02</text>
<text x="90" y="225" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">DECIDE</text>
<text x="90" y="247" class="mono" font-size="12.5" fill="#A9BCD6">ADRs · CONVENTIONS.md</text>
</g>
<g class="rise" style="animation-delay:0.26s">
<rect x="72" y="270" width="230" height="88" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M84 271H290" stroke="#5CCBD2" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<rect x="90" y="286" width="12" height="12" rx="3" fill="#0C2533" stroke="#5CCBD2" stroke-width="1.4"/><rect x="93.5" y="289.5" width="5" height="5" rx="1" fill="#5CCBD2" class="node" style="animation-delay:0.70s"/>
<text x="284" y="297" class="mono" font-size="12" fill="#5CCBD2" text-anchor="end" letter-spacing="1">03</text>
<text x="90" y="324" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">ORCHESTRATE</text>
<text x="90" y="346" class="mono" font-size="12.5" fill="#A9BCD6">lead session · tasks</text>
</g>
<g class="rise" style="animation-delay:0.34s">
<rect x="340" y="72" width="202" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M352 73H530" stroke="#63C7D8" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<circle cx="364" cy="94" r="6" fill="#63C7D8" class="node" style="animation-delay:1.05s"/>
<text x="524" y="99" class="mono" font-size="12" fill="#63C7D8" text-anchor="end" letter-spacing="1">04</text>
<text x="358" y="132" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">PLAN</text>
<text x="358" y="158" class="mono" font-size="12.5" fill="#A9BCD6">explore the code</text>
<text x="358" y="177" class="mono" font-size="12.5" fill="#6A84A6">written plan, approved</text>
</g>
<g class="rise" style="animation-delay:0.42s">
<rect x="562" y="72" width="202" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M574 73H752" stroke="#69C4DF" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<circle cx="586" cy="94" r="6" fill="#69C4DF" class="node" style="animation-delay:1.40s"/>
<text x="746" y="99" class="mono" font-size="12" fill="#69C4DF" text-anchor="end" letter-spacing="1">05</text>
<text x="580" y="132" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">TEST FIRST</text>
<text x="580" y="158" class="mono" font-size="12.5" fill="#A9BCD6">failing tests</text>
<text x="580" y="177" class="mono" font-size="12.5" fill="#6A84A6">before any code</text>
</g>
<g class="rise" style="animation-delay:0.50s">
<rect x="784" y="72" width="202" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M796 73H974" stroke="#70C1E5" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<circle cx="808" cy="94" r="6" fill="#70C1E5" class="node" style="animation-delay:1.75s"/>
<text x="968" y="99" class="mono" font-size="12" fill="#70C1E5" text-anchor="end" letter-spacing="1">06</text>
<text x="802" y="132" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">BUILD</text>
<text x="802" y="158" class="mono" font-size="12.5" fill="#A9BCD6">sub-agents · worktrees</text>
<text x="802" y="177" class="mono" font-size="12.5" fill="#6A84A6">hooks on every edit</text>
</g>
<g class="rise" style="animation-delay:0.58s">
<rect x="1006" y="72" width="202" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M1018 73H1196" stroke="#76BEEC" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<circle cx="1030" cy="94" r="6" fill="#76BEEC" class="node" style="animation-delay:2.10s"/>
<text x="1190" y="99" class="mono" font-size="12" fill="#76BEEC" text-anchor="end" letter-spacing="1">07</text>
<text x="1024" y="132" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">SELF-VERIFY</text>
<text x="1024" y="158" class="mono" font-size="12.5" fill="#A9BCD6">run · observe · fix</text>
<text x="1024" y="177" class="mono" font-size="12.5" fill="#6A84A6">through MCP tools</text>
</g>
<g class="rise" style="animation-delay:0.66s">
<rect x="1006" y="230" width="202" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M1018 231H1196" stroke="#7DBAF2" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<circle cx="1030" cy="252" r="6" fill="#7DBAF2" class="node" style="animation-delay:2.45s"/>
<text x="1190" y="257" class="mono" font-size="12" fill="#7DBAF2" text-anchor="end" letter-spacing="1">08</text>
<text x="1024" y="290" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">REVIEW</text>
<text x="1024" y="316" class="mono" font-size="12.5" fill="#A9BCD6">reviewer agent</text>
<text x="1024" y="335" class="mono" font-size="12.5" fill="#6A84A6">then human review</text>
</g>
<g class="rise" style="animation-delay:0.74s">
<rect x="784" y="230" width="202" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M796 231H974" stroke="#83B7F9" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<circle cx="808" cy="252" r="6" fill="#83B7F9" class="node" style="animation-delay:2.80s"/>
<text x="968" y="257" class="mono" font-size="12" fill="#83B7F9" text-anchor="end" letter-spacing="1">09</text>
<text x="802" y="290" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">SHIP</text>
<text x="802" y="316" class="mono" font-size="12.5" fill="#A9BCD6">all checks green</text>
<text x="802" y="335" class="mono" font-size="12.5" fill="#6A84A6">merge + release</text>
</g>
<g class="rise" style="animation-delay:0.82s">
<rect x="562" y="230" width="202" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M574 231H752" stroke="#8AB4FF" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<circle cx="586" cy="252" r="6" fill="#8AB4FF" class="node" style="animation-delay:3.15s"/>
<text x="746" y="257" class="mono" font-size="12" fill="#8AB4FF" text-anchor="end" letter-spacing="1">10</text>
<text x="580" y="290" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">LEARN</text>
<text x="580" y="316" class="mono" font-size="12.5" fill="#A9BCD6">rules · tests · ADRs</text>
<text x="580" y="335" class="mono" font-size="12.5" fill="#6A84A6">CLAUDE.md updated</text>
</g>
<text x="72" y="386" class="mono" font-size="12.5" fill="#4F6F97">once per project · human: vision + decisions</text>
<text x="1208" y="386" class="mono" font-size="12.5" fill="#4F6F97" text-anchor="end">every task · agents build, I approve</text>
<line x1="72" y1="411" x2="1208" y2="411" stroke="url(#edgeLine)" stroke-width="2"/>
</g>
<rect x=".5" y=".5" width="1279" height="411" rx="13.5" fill="none" stroke="#1B3354"/>
</svg>
