<text x="802" y="182" class="mono" font-size="12.5" fill="#A9BCD6">sub-agents · worktrees</text>
<text x="802" y="201" class="mono" font-size="12.5" fill="#6A84A6">hooks on every edit</text>
</g>
<g class="rise" style="animation-delay:0.58s">
