<text x="1190" y="281" class="mono" font-size="12" fill="#7DBAF2" text-anchor="end" letter-spacing="1">08</text>
<text x="1024" y="314" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">REVIEW</text>
<text x="1024" y="340" class="mono" font-size="12.5" fill="#A9BCD6">reviewer agent</text>
<text x="1024" y="359" class="mono" font-size="12.5" fill="#6A84A6">then human review</text>
</g>
<g class="rise" style="animation-delay:0.74s">
