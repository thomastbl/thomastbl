<rect x="90" y="112" width="12" height="12" rx="3" fill="#0C2533" stroke="#4FD1C5" stroke-width="1.4"/><rect x="93.5" y="115.5" width="5" height="5" rx="1" fill="#4FD1C5" class="node" style="animation-delay:0.00s"/>
<text x="284" y="123" class="mono" font-size="12" fill="#4FD1C5" text-anchor="end" letter-spacing="1">01</text>
<text x="90" y="150" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">VISION</text>
<text x="90" y="172" class="mono" font-size="12.5" fill="#A9BCD6">vision.md · roadmap.md</text>
</g>
