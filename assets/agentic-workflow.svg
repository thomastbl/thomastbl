<text x="340" y="82" class="mono" font-size="12" fill="#4F6F97" letter-spacing=".5">per task, as far as the risk requires</text>
<text x="72" y="436" class="mono" font-size="13" fill="#A9BCD6">rigor scales with risk</text>
