<text x="284" y="222" class="mono" font-size="12" fill="#56CECB" text-anchor="end" letter-spacing="1">02</text>
<text x="90" y="249" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">DECIDE</text>
<text x="90" y="271" class="mono" font-size="12.5" fill="#A9BCD6">ADRs · CONVENTIONS.md</text>
