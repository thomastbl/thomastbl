<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="292" viewBox="0 0 1280 292" role="img" aria-labelledby="t d">
<title id="t">Agentic workflow</title>
<desc id="d">Vision, decide, orchestrate, build with parallel sub-agents in git worktrees, verify with hooks and tests, then human review and ship. The loop repeats for each milestone.</desc>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.node{animation:glow 3.2s ease-in-out infinite}
.loop{stroke-dasharray:6 8;animation:loop 1.4s linear infinite}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes loop{to{stroke-dashoffset:-28}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08121F"/><stop offset=".55" stop-color="#0B1A2E"/><stop offset="1" stop-color="#0E2340"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#18314F" stroke-width="1" opacity=".45"/></pattern>
<linearGradient id="flow" x1="72" y1="0" x2="1208" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4FD1C5"/><stop offset="1" stop-color="#8AB4FF"/></linearGradient>
<linearGradient id="edgeLine" x1="72" y1="0" x2="1208" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4FD1C5" stop-opacity="0"/><stop offset=".3" stop-color="#4FD1C5" stop-opacity=".7"/><stop offset=".7" stop-color="#8AB4FF" stop-opacity=".7"/><stop offset="1" stop-color="#8AB4FF" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect width="1280" height="292" rx="14"/></clipPath>
<marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#4F6F97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g clip-path="url(#frame)">
<rect width="1280" height="292" fill="url(#bg)"/>
<rect width="1280" height="292" fill="url(#grid)" opacity=".6"/>
<g class="mono" font-size="14">
<text x="72" y="44" fill="#4B6A92">thomas@work:~$</text>
<text x="205" y="44" fill="#CFE3FF">cat workflow.md</text>
<rect x="343" y="31" width="8" height="16" fill="#4FD1C5" class="blink"/>
<text x="1208" y="44" fill="#4F6F97" text-anchor="end" letter-spacing="1">spec → agents → ship</text>
</g>
<line x1="72" y1="136" x2="1208" y2="136" stroke="url(#flow)" stroke-width="2" opacity=".55"/>
<circle r="3.4" fill="#EAF2FF"><animateMotion dur="5s" repeatCount="indefinite" path="M72 136 H1208"/><animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.05;.95;1"/></circle>

<g class="rise" style="animation-delay:0.15s">
<rect x="72" y="72" width="168" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M84 73H228" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<rect x="90" y="90" width="12" height="12" rx="3" fill="#0C2533" stroke="#4FD1C5" stroke-width="1.4"/><rect x="93.5" y="93.5" width="5" height="5" rx="1" fill="#4FD1C5" class="node" style="animation-delay:0.0s"/>
<text x="222" y="101" class="mono" font-size="12" fill="#4FD1C5" text-anchor="end" letter-spacing="1">01</text>
<text x="90" y="136" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">VISION</text>
<text x="90" y="164" class="mono" font-size="12.5" fill="#A9BCD6">vision.md</text>
<text x="90" y="183" class="mono" font-size="12.5" fill="#6A84A6">roadmap.md</text>
</g>
<g class="rise" style="animation-delay:0.27s">
<rect x="266" y="72" width="168" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M278 73H422" stroke="#5BCBD1" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<rect x="284" y="90" width="12" height="12" rx="3" fill="#0C2533" stroke="#5BCBD1" stroke-width="1.4"/><rect x="287.5" y="93.5" width="5" height="5" rx="1" fill="#5BCBD1" class="node" style="animation-delay:0.5s"/>
<text x="416" y="101" class="mono" font-size="12" fill="#5BCBD1" text-anchor="end" letter-spacing="1">02</text>
<text x="284" y="136" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">DECIDE</text>
<text x="284" y="164" class="mono" font-size="12.5" fill="#A9BCD6">ADRs</text>
<text x="284" y="183" class="mono" font-size="12.5" fill="#6A84A6">conventions</text>
</g>
<g class="rise" style="animation-delay:0.39s">
<rect x="459" y="72" width="168" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M471 73H615" stroke="#67C5DC" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<rect x="477" y="90" width="12" height="12" rx="3" fill="#0C2533" stroke="#67C5DC" stroke-width="1.4"/><rect x="480.5" y="93.5" width="5" height="5" rx="1" fill="#67C5DC" class="node" style="animation-delay:1.0s"/>
<text x="609" y="101" class="mono" font-size="12" fill="#67C5DC" text-anchor="end" letter-spacing="1">03</text>
<text x="477" y="136" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">ORCHESTRATE</text>
<text x="477" y="164" class="mono" font-size="12.5" fill="#A9BCD6">lead session</text>
<text x="477" y="183" class="mono" font-size="12.5" fill="#6A84A6">state + tasks</text>
</g>
<g class="rise" style="animation-delay:0.51s">
<rect x="653" y="72" width="168" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M665 73H809" stroke="#72C0E8" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<circle cx="677" cy="96" r="6" fill="#72C0E8" class="node" style="animation-delay:1.5s"/>
<text x="803" y="101" class="mono" font-size="12" fill="#72C0E8" text-anchor="end" letter-spacing="1">04</text>
<text x="671" y="136" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">BUILD</text>
<text x="671" y="164" class="mono" font-size="12.5" fill="#A9BCD6">sub-agents</text>
<text x="671" y="183" class="mono" font-size="12.5" fill="#6A84A6">git worktrees</text>
</g>
<g class="rise" style="animation-delay:0.63s">
<rect x="846" y="72" width="168" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M858 73H1002" stroke="#7EBAF3" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<circle cx="870" cy="96" r="6" fill="#7EBAF3" class="node" style="animation-delay:2.0s"/>
<text x="996" y="101" class="mono" font-size="12" fill="#7EBAF3" text-anchor="end" letter-spacing="1">05</text>
<text x="864" y="136" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">VERIFY</text>
<text x="864" y="164" class="mono" font-size="12.5" fill="#A9BCD6">hooks · tests</text>
<text x="864" y="183" class="mono" font-size="12.5" fill="#6A84A6">arch rules</text>
</g>
<g class="rise" style="animation-delay:0.75s">
<rect x="1040" y="72" width="168" height="128" rx="12" fill="#0F2440" stroke="#23446C" stroke-width="1.2"/>
<path d="M1052 73H1196" stroke="#8AB4FF" stroke-width="2" stroke-linecap="round" opacity=".9"/>
<circle cx="1064" cy="96" r="6" fill="#8AB4FF" class="node" style="animation-delay:2.5s"/>
<text x="1190" y="101" class="mono" font-size="12" fill="#8AB4FF" text-anchor="end" letter-spacing="1">06</text>
<text x="1058" y="136" class="sans" font-size="16" font-weight="700" letter-spacing=".8" fill="#EAF2FF">REVIEW &amp; SHIP</text>
<text x="1058" y="164" class="mono" font-size="12.5" fill="#A9BCD6">human review</text>
<text x="1058" y="183" class="mono" font-size="12.5" fill="#6A84A6">merge + release</text>
</g>
<path class="loop" d="M1124 206V232Q1124 244 1112 244H555Q543 244 543 232V210" fill="none" stroke="#4F6F97" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="715" y="233" width="236" height="22" rx="6" fill="#0B1A2E"/>
<text x="833" y="248" class="mono" font-size="12.5" fill="#7FA6D6" text-anchor="middle" letter-spacing=".5">↻ iterate · next milestone</text>
<text x="72" y="248" class="mono" font-size="12.5" fill="#4F6F97">human: vision + decisions</text>
<line x1="72" y1="291" x2="1208" y2="291" stroke="url(#edgeLine)" stroke-width="2"/>
</g>
<rect x=".5" y=".5" width="1279" height="291" rx="13.5" fill="none" stroke="#1B3354"/>
</svg>
