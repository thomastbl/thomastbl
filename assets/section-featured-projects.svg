<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="72" viewBox="0 0 1280 72" role="img" aria-label="Featured Projects">
<title>Featured Projects</title>
<defs>
<linearGradient id="lineL" x1="72" y1="0" x2="456" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4FD1C5" stop-opacity="0"/><stop offset="1" stop-color="#4FD1C5" stop-opacity=".8"/></linearGradient>
<linearGradient id="lineR" x1="824" y1="0" x2="1208" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8AB4FF" stop-opacity=".8"/><stop offset="1" stop-color="#8AB4FF" stop-opacity="0"/></linearGradient>
