<text x="541" y="45" font-size="26" font-weight="700" letter-spacing="-.2" fill="#EAF2FF" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">Featured Projects</text>
